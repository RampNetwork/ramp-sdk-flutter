name: ramp_flutter_example
description: "Demonstrates how to use the ramp_flutter package."
version: 1.0.0+1
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ramp_flutter:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

# Overrides only apply in the *root* package. Required when running the example.
# Same fork as ramp_flutter — https://github.com/mateusz-ramp/flutter_packages/tree/webview-target-blank
dependency_overrides:
  webview_flutter:
    git:
      url: https://github.com/mateusz-ramp/flutter_packages.git
      ref: webview-target-blank
      path: packages/webview_flutter/webview_flutter
  webview_flutter_android:
    git:
      url: https://github.com/mateusz-ramp/flutter_packages.git
      ref: webview-target-blank
      path: packages/webview_flutter/webview_flutter_android
  webview_flutter_wkwebview:
    git:
      url: https://github.com/mateusz-ramp/flutter_packages.git
      ref: webview-target-blank
      path: packages/webview_flutter/webview_flutter_wkwebview
  webview_flutter_platform_interface:
    git:
      url: https://github.com/mateusz-ramp/flutter_packages.git
      ref: webview-target-blank
      path: packages/webview_flutter/webview_flutter_platform_interface

flutter:
  uses-material-design: true
