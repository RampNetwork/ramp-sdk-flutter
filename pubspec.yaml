name: ramp_flutter
description: "Ramp Network for Flutter loads the Ramp widget in a Flutter WebView with a unified Dart API for iOS and Android."
version: 5.0.0
homepage: https://ramp.network/

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.13.0
  webview_flutter_wkwebview: ^3.26.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Fork of flutter/packages with NavigationDelegate.onCreateWindow.
# Host apps must repeat these overrides (they only apply in the root package).
# https://github.com/mateusz-ramp/flutter_packages/tree/webview-target-blank
dependency_overrides:
  webview_flutter:
    git:
      url: https://github.com/mateusz-ramp/flutter_packages.git
      ref: webview-target-blank
      path: packages/webview_flutter/webview_flutter
  webview_flutter_android:
    git:
      url: https://github.com/mateusz-ramp/flutter_packages.git
      ref: webview-target-blank
      path: packages/webview_flutter/webview_flutter_android
  webview_flutter_wkwebview:
    git:
      url: https://github.com/mateusz-ramp/flutter_packages.git
      ref: webview-target-blank
      path: packages/webview_flutter/webview_flutter_wkwebview
  webview_flutter_platform_interface:
    git:
      url: https://github.com/mateusz-ramp/flutter_packages.git
      ref: webview-target-blank
      path: packages/webview_flutter/webview_flutter_platform_interface
